[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deductive-coding"
version = "0.1.0"
description = "Research prototype investigating Deductive Coding and the deduction gap"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "zstandard>=0.22",
    "brotli>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deductive = "deductive.cli:main"

[project.urls]
Repository = "https://github.com/Xeloraa/deductive-coding"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
